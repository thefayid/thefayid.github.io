<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rahman Fayid PM — Cybersecurity &amp; Systems portfolio exploring systems, security, networks, and applied AI." />
    <meta name="theme-color" content="#08090B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)" />
    <title>Rahman Fayid PM — Cybersecurity &amp; Systems</title>

    <!--
      Flash-of-unstyled-theme prevention.
      Default is WHITE MODE (LIGHT) as specified.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fayid-theme-white-default');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
